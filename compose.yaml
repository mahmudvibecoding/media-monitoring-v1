name: media-monitoring-v1

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: media_monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    shm_size: 256mb

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "media_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  importer:
    build: .
    profiles: ["tools"]

volumes:
  postgres_data:
